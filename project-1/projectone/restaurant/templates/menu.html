{% extends 'base.html' %}
{% load static %}

{% block content %}

<section class="menu">
  {% for item in menu_items %}
  <article class="menu-card">
    <div class="menu-card__content">

      <h2 class="menu-card__title">{{ item.name }}</h2>

      <p class="menu-card__price">
        {{ item.price }}
      </p>

      <a
        href="{% url 'menu_item' pk=item.pk %}"
        class="menu-card__btn"
      >
        View Details
      </a>

    </div>
  </article>
  {% endfor %}
</section>

{% endblock %}
